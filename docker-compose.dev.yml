# Local development stack for the full Axiom AI platform (spec section 3).
#
#   make up      boot everything
#   make smoke   verify all health endpoints
#   make down    tear down
#
# Traefik routes per the architecture spec:
#   api.axiom.ai/v1/models    -> axiom-gateway
#   api.axiom.ai/v1/knowledge -> axiom-rag-pipeline
#   api.axiom.ai/v1/agents    -> axiom-agent-runtime

name: axiom-ai

x-ts-service: &ts-service
  env_file:
    - path: .env
      required: false

services:
  # ------------------------------ Infrastructure -----------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom
      POSTGRES_DB: axiom_metadata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: axiom
      CLICKHOUSE_PASSWORD: axiom
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':<(/dev/tcp/localhost/6333)' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    command: ["--query.http-server.host-port=0.0.0.0:16686"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  traefik:
    image: traefik:v3.5
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro

  # --------------------------------- Services ---------------------------------
  gateway:
    <<: *ts-service
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_WORKSPACE: "@axiom-ai/gateway"
        SERVICE_DIR: gateway
        SERVICE_ENTRY: services/gateway/dist/index.js
    environment:
      AXIOM_ENV: ${AXIOM_ENV:-development}
      GATEWAY_PORT: "3000"
      REDIS_PRIMARY_URL: redis://redis:6379/0
      CLICKHOUSE_NODES: axiom:axiom@clickhouse:8123
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy

  rag-pipeline:
    build:
      context: services/rag-pipeline
    environment:
      AXIOM_ENV: ${AXIOM_ENV:-development}
      REDIS_PRIMARY_URL: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  agent-runtime:
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_WORKSPACE: "@axiom-ai/agent-runtime"
        SERVICE_DIR: agent-runtime
        SERVICE_ENTRY: services/agent-runtime/dist/index.js
    environment:
      AXIOM_ENV: ${AXIOM_ENV:-development}
      AGENT_RUNTIME_PORT: "5000"
      REDIS_PRIMARY_URL: redis://redis:6379/2
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  ops-observability:
    build:
      context: .
      dockerfile: deploy/docker/service.Dockerfile
      args:
        SERVICE_WORKSPACE: "@axiom-ai/ops-observability"
        SERVICE_DIR: ops-observability
        SERVICE_ENTRY: services/ops-observability/dist/index.js
    environment:
      AXIOM_ENV: ${AXIOM_ENV:-development}
      OBSERVABILITY_PORT: "4000"
      POSTGRES_DB_URI: postgresql://axiom:axiom@postgres:5432/axiom_metadata
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      # Host 4000 can collide with other local tooling; container keeps spec port 4000.
      - "14000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  clickhouse_data:
  qdrant_storage:
