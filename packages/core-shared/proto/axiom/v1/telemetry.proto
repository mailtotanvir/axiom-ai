syntax = "proto3";

package axiom.v1;

// Observability control plane: trace query surface over ClickHouse.
// Span *ingest* uses standard OTLP; this proto exposes Axiom-specific queries.

message TraceQuery {
  string trace_id = 1;
  optional string tenant_id = 2;
  int64 since_unix = 3;
  uint32 limit = 4;
}

message LlmSpan {
  string span_id = 1;
  string trace_id = 2;
  string parent_span_id = 3;
  string service_name = 4;
  string name = 5;
  int64 started_at_unix = 6;
  uint32 duration_ms = 7;
  map<string, string> attributes = 8;
  // LLM semantic attributes (subset of otel semconv for GenAI).
  optional string gen_ai_model = 20;
  optional uint32 prompt_tokens = 21;
  optional uint32 completion_tokens = 22;
  optional double cost_usd = 23;
}

message TraceQueryResponse {
  repeated LlmSpan spans = 1;
}

message EvalResult {
  string eval_run_id = 1;
  string prompt_version = 2;
  string dataset_version = 3;
  string metric_name = 4;   // e.g. "faithfulness", "answer_relevancy"
  double score = 5;
  bool passed = 6;
}

service TelemetryService {
  rpc QueryTrace(TraceQuery) returns (TraceQueryResponse);
}
