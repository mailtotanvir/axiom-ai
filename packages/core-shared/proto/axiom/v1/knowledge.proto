syntax = "proto3";

package axiom.v1;

// Knowledge pipeline contract for ingestion and retrieval.

message DocumentSource {
  oneof source {
    bytes inline_content = 1;   // small documents
    string uri = 2;             // s3:// or https:// location resolved server-side
  }
  string content_type = 3;
  string filename = 4;
}

message IngestDocumentRequest {
  DocumentSource source = 1;
  string tenant_id = 2;        // must match verified JWT claims
  string project_id = 3;
  map<string, string> metadata = 4;
  ChunkingOptions chunking = 5;
}

message ChunkingOptions {
  string strategy = 1; // "fixed" | "recursive" | "sentence_window" | "layout"
  uint32 target_chunk_tokens = 2;
  uint32 overlap_tokens = 3;
}

message IngestStatus {
  string document_id = 1;
  string state = 2; // "queued" | "parsing" | "chunking" | "embedding" | "indexed" | "failed"
  uint32 chunks_indexed = 3;
  optional string error_message = 4;
}

message RetrieveRequest {
  string query = 1;
  string tenant_id = 2;
  string project_id = 3;
  uint32 top_k = 4;
  optional float score_threshold = 5;
  bool use_cache = 6;
}

message RetrievedChunk {
  string chunk_id = 1;
  string document_id = 2;
  float score = 3;
  string text = 4;
  map<string, string> metadata = 5;
}

message RetrieveResponse {
  repeated RetrievedChunk chunks = 1;
  bool served_from_cache = 2;
}

service KnowledgeService {
  rpc IngestDocument(IngestDocumentRequest) returns (stream IngestStatus);
  rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
}
