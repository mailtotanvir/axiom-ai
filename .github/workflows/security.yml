name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Tuesday 03:20 UTC scan cadence for newly published CVEs.
    - cron: "20 3 * * 2"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Secret leak scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy vulnerability + config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Scan the IaC (compose files, Dockerfiles) plus the dependency tree;
      # container images themselves are scanned at release time on GHCR.
      - name: Scan repo filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
          format: sarif
          output: trivy.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  trivy-images:
    name: Trivy container image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, agent-runtime, ops-observability, rag-pipeline]
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: |
          if [ "${{ matrix.image }}" = "rag-pipeline" ]; then
            docker build -f services/rag-pipeline/Dockerfile -t axiom-local/${{ matrix.image }}:ci services/rag-pipeline
          else
            docker build -f deploy/docker/service.Dockerfile \
              --build-arg SERVICE_WORKSPACE=@axiom-ai/${{ matrix.image }} \
              --build-arg SERVICE_DIR=${{ matrix.image }} \
              --build-arg SERVICE_ENTRY=services/${{ matrix.image }}/dist/index.js \
              -t axiom-local/${{ matrix.image }}:ci .
          fi
      - name: Scan built image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: axiom-local/${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
