name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish-images:
    name: Publish ${{ matrix.service }} image (GHCR)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            workspace: "@axiom-ai/gateway"
            dir: gateway
            entry: services/gateway/dist/index.js
          - service: rag-pipeline
            dir: rag-pipeline
          - service: agent-runtime
            workspace: "@axiom-ai/agent-runtime"
            dir: agent-runtime
            entry: services/agent-runtime/dist/index.js
          - service: ops-observability
            workspace: "@axiom-ai/ops-observability"
            dir: ops-observability
            entry: services/ops-observability/dist/index.js
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/axiom-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'rag-pipeline' && 'services/rag-pipeline' || '.' }}
          file: ${{ matrix.service == 'rag-pipeline' && 'services/rag-pipeline/Dockerfile' || 'deploy/docker/service.Dockerfile' }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_WORKSPACE=${{ matrix.workspace }}
            SERVICE_DIR=${{ matrix.dir }}
            SERVICE_ENTRY=${{ matrix.entry }}
