name: Release

# Milestone 5.6: on a v* tag, build multi-arch images, push to GHCR,
# and publish @tanvir1971/core to npm.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packages/core-shared/**"
      - "deploy/docker/**"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Full test suite gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @tanvir1971/core
      - run: npm test -w @tanvir1971/core
      - run: npm test -w @axiom-ai/gateway
      - run: npm test -w @axiom-ai/agent-runtime
      - run: npm test -w @axiom-ai/ops-observability

  images:
    name: GHCR multi-arch image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: axiom-gateway
            dockerfile: deploy/docker/service.Dockerfile
            build_args: '--build-arg SERVICE_WORKSPACE=@axiom-ai/gateway --build-arg SERVICE_DIR=gateway --build-arg SERVICE_ENTRY=services/gateway/dist/index.js'
            context: .
          - image: axiom-agent-runtime
            dockerfile: deploy/docker/service.Dockerfile
            build_args: '--build-arg SERVICE_WORKSPACE=@axiom-ai/agent-runtime --build-arg SERVICE_DIR=agent-runtime --build-arg SERVICE_ENTRY=services/agent-runtime/dist/index.js'
            context: .
          - image: axiom-ops-observability
            dockerfile: deploy/docker/service.Dockerfile
            build_args: '--build-arg SERVICE_WORKSPACE=@axiom-ai/ops-observability --build-arg SERVICE_DIR=ops-observability --build-arg SERVICE_ENTRY=services/ops-observability/dist/index.js'
            context: .
          - image: axiom-rag-pipeline
            dockerfile: Dockerfile
            build_args: ""
            context: services/rag-pipeline
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  npm-core:
    name: Publish @tanvir1971/core to npm
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @tanvir1971/core
      - name: Verify version matches tag
        run: |
          PKG_VERSION="v$(node -p "require('./packages/core-shared/package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version $PKG_VERSION"
            exit 1
          fi
      - run: npm publish --access public -w @tanvir1971/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [images, npm-core]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
