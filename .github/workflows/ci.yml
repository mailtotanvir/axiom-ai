name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core-shared (build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @tanvir1971/core
      - run: npm test -w @tanvir1971/core

  ts-services:
    name: ${{ matrix.service }} (build · test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, agent-runtime, ops-observability]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @axiom-ai/${{ matrix.service }}
      - run: npx eslint services/${{ matrix.service }}/src services/${{ matrix.service }}/test
      - run: npm test -w @axiom-ai/${{ matrix.service }}

  rag-pipeline:
    name: rag-pipeline (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag-pipeline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/rag-pipeline/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy app
      - run: pytest -q

  proto:
    name: protobuf (buf lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-action@v1
        with:
          input: packages/core-shared

  docker:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [core]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            workspace: "@axiom-ai/gateway"
            dir: gateway
            entry: services/gateway/dist/index.js
          - service: agent-runtime
            workspace: "@axiom-ai/agent-runtime"
            dir: agent-runtime
            entry: services/agent-runtime/dist/index.js
          - service: ops-observability
            workspace: "@axiom-ai/ops-observability"
            dir: ops-observability
            entry: services/ops-observability/dist/index.js
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/service.Dockerfile
          push: false
          build-args: |
            SERVICE_WORKSPACE=${{ matrix.workspace }}
            SERVICE_DIR=${{ matrix.dir }}
            SERVICE_ENTRY=${{ matrix.entry }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  rag-pipeline-docker:
    name: docker build (rag-pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/rag-pipeline
          push: false
          cache-from: type=gha,scope=rag-pipeline
          cache-to: type=gha,scope=rag-pipeline,mode=max
